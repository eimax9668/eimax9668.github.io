<!DOCTYPE html>
<html lang="ja">

<head prefix="og: https://ogp.me/ns#">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diary - ei-max.net</title>
    <meta name="description" content="私は誰か、何をしているのか、そして思ったことを書く">
    <meta property="og:type" content="article">
    <meta property="og:url" content="https://ei-max.net/diaries/diary.html" />
    <meta property="og:title" content="ダークモード実装とか - ei-max.net" />
    <meta property="og:description" content="私は誰か、何をしているのか、そして思ったことを書く" />
    <link rel="stylesheet" href="../styles/style.css">


    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script>
        // 保存されているテーマを取得
        const theme = localStorage.getItem('theme') || 'light';
        document.documentElement.dataset.theme = theme;
    </script>
</head>

<body>
    <div id="header"></div>
    <main>
        <h1>Diary</h1>
        <p>日記です。たぶん続きません。</p><span class="spacer"></span>
        
        <div id="article-list"></div>

        <script>
            fetch('articles.json')
                .then(response => response.json())
                .then(data => {
                    const list = document.getElementById('article-list');
                    data.forEach(article => {
                        const div = document.createElement('div');
                        div.className = 'article';
                        div.innerHTML = `
                            <a href="${article.filename}" class="article-link">${article.title}</a>
                            <br><span class="article-date">${article.dateText}</span>
                        `;
                        list.appendChild(div);
                    });
                })
                .catch(error => console.error('記事一覧の読み込みに失敗しました:', error));
        </script>

        <div id="footer"></div>
    </main>
    <script src="/scripts/script.js" defer></script>
    <script src="/scripts/header.js" defer></script>
</body>

</html>
